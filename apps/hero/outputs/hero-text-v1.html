<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hero Block</title>

    <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
/* Main hero container */
.hero {
    @apply flex items-center w-full px-6 py-16 md:px-16 md:py-24;
}

/* Content container */
.hero-content {
    @apply w-full max-w-5xl;
}

/* Light appearance */
.hero-light {
    @apply bg-slate-50;
}

.hero-light h1 {
    @apply text-slate-900;
}

.hero-light h2 {
    @apply text-slate-700;
}

/* Dark appearance */
.hero-dark {
    @apply bg-slate-900;
}

.hero-dark h1 {
    @apply text-slate-50;
}

.hero-dark h2 {
    @apply text-slate-300;
}

/* Centre alignment */
.hero-centre {
    @apply text-center;
}

.hero-centre .hero-content {
    margin-inline: auto;
}

/* Minimum height */
.hero-min-height {
    @apply min-h-[480px];
}

@media (min-width: 768px) {
    .hero-min-height {
        min-height: 85vh;
    }
}

/* Heading styles */
.hero h1 {
    @apply text-4xl font-bold tracking-tight leading-tight md:text-6xl;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.hero h2 {
    @apply mt-6 text-lg leading-relaxed md:text-2xl;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}
    </style>

</head>
<body>

<header class="hero hero-dark hero-centre hero-min-height">
    <div class="hero-content">
        <h1>Lorem ipsum dolor sit amet</h1>
        
                    <h2>Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
                
    </div>
</header>

</body>
</html>
